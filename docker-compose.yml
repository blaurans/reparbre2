services:
  app:
    build: .
    container_name: reparbre2-app
    environment:
      - DATA_DIR=/app/data
      - ORIGIN=https://reparbre2.laurans.org
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - headscale_default

networks:
  headscale_default:
    external: true
